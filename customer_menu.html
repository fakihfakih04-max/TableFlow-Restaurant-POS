<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TableFlow Customer Menu</title><style>:root{--a:#f4773b;--ink:#172033;--muted:#64748b;--line:#e4e9f1;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#172033,#273b58);color:white;padding:25px;border-radius:20px;margin-bottom:18px}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#d5deeb}.toolbar{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}input,select,textarea{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white;min-width:0}input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}.item{border:1px solid var(--line);background:white;border-radius:16px;padding:16px;text-align:left;cursor:pointer}.emoji{font-size:32px;display:block}.item strong{display:block;margin:9px 0}.price{color:var(--a);font-weight:800}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}.btn{background:var(--a);border:0;color:white;font-weight:800;padding:13px 18px;border-radius:11px;cursor:pointer}.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.total{font-size:23px;font-weight:900;display:flex;justify-content:space-between;margin:15px 0}.muted{color:var(--muted);font-size:13px}.msg{padding:12px;border-radius:10px;background:#e7f8ee;color:#146c3a;display:none;margin:12px 0}.error{background:#fff0ee;color:#a52a1a}@media(max-width:600px){.wrap{padding:10px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.hero{padding:18px}}</style></head><body><main class="wrap"><header class="hero"><h1 id="brand">TableFlow Restaurant</h1><p>Browse the menu and place your order from your phone.</p><p class="muted" id="mode" style="color:#d5deeb;margin-top:10px"></p></header><div id="msg" class="msg"></div><div class="toolbar"><input id="search" placeholder="Search menu items…"><select id="category"><option value="All">All categories</option></select></div><div class="grid" id="menu"></div><section class="panel"><h2>Your order</h2><div id="cart"><p class="muted">Choose items above to start.</p></div><div class="fields" style="margin-top:15px"><input id="name" placeholder="Your name"><input id="phone" placeholder="Phone number"><select id="type"><option value="Delivery">Delivery</option><option value="Takeaway">Pickup / takeaway</option><option value="Dine-in">Dine-in (QR table)</option></select><input id="address" placeholder="Delivery address"><textarea id="note" class="wide" placeholder="Notes / extras / no onions"></textarea></div><div class="total"><span>Total</span><span id="total">$0.00</span></div><button class="btn" id="submit">Place order</button></section></main><script>
const $=id=>document.getElementById(id);const brand=$('brand'),mode=$('mode'),type=$('type'),msg=$('msg'),search=$('search'),category=$('category'),total=$('total'),address=$('address'),name=$('name'),phone=$('phone'),note=$('note'),submit=$('submit');const params=new URLSearchParams(location.search),table=params.get('table');if(table){type.value='Dine-in';type.disabled=true;document.querySelector('#mode').textContent='QR ordering · Table '+table}else document.querySelector('#mode').textContent='Online ordering · Delivery or pickup';let menu=[],cart=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toFixed(2);function say(t,e=false){msg.textContent=t;msg.className='msg'+(e?' error':'');msg.style.display='block'}async function load(){try{let r=await fetch('/api/menu'),d=await r.json();menu=d.items||[];brand.textContent=d.settings?.name||'TableFlow Restaurant';category.innerHTML=['All',...(d.categories||[])].map(c=>`<option>${esc(c)}</option>`).join('');draw()}catch(e){say('Unable to load menu. Please try again later.',true)}}function draw(){let q=search.value.toLowerCase(),c=category.value;const menuGrid=document.querySelector('#menu');menuGrid.innerHTML=menu.filter(i=>(!q||String(i.name).toLowerCase().includes(q))&&(c==='All'||i.category===c)).map(i=>`<button class="item" data-id="${esc(i.id)}"><span class="emoji">${esc(i.emoji||'🍽️')}</span><strong>${esc(i.name)}</strong><span class="muted">${esc(i.category||'Menu')}</span><div class="price">${money(i.price)}</div></button>`).join('')||'<p>No menu items published yet.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let i=menu.find(x=>String(x.id)===b.dataset.id),found=cart.find(x=>String(x.id)===b.dataset.id);if(found)found.qty++;else cart.push({id:i.id,name:i.name,price:Number(i.price),qty:1});drawCart()})}function drawCart(){const cartEl=document.querySelector('#cart');cartEl.innerHTML=cart.map((i,n)=>`<div class="line"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.price*i.qty)} <button data-remove="${n}">−</button></span></div>`).join('')||'<p class="muted">Choose items above to start.</p>';total.textContent=money(cart.reduce((s,i)=>s+i.price*i.qty,0));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let n=+b.dataset.remove;cart[n].qty--;if(cart[n].qty<=0)cart.splice(n,1);drawCart()})}search.oninput=draw;category.onchange=draw;type.onchange=()=>address.style.display=type.value==='Delivery'?'':'none';submit.onclick=async()=>{if(!cart.length)return say('Please choose at least one item.',true);if(!name.value.trim()||!phone.value.trim()||(type.value==='Delivery'&&!address.value.trim()))return say('Enter your name and phone; delivery also needs an address.',true);let b=submit;b.disabled=true;b.textContent='Sending…';try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type.value,tableId:table||null,customer:name.value,phone:phone.value,address:address.value,items:cart,note:note.value,sourceRef:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random())})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Order failed');cart=[];drawCart();say('Order #'+d.orderId+' sent to the restaurant.')}catch(e){say(e.message,true)}finally{b.disabled=false;b.textContent='Place order'}};load();
</script></body></html>
